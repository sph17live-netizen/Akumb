// ---------- storage (Firebase Realtime Database) ----------
const FIREBASE_DB_URL = "https://akumb-1dc5a-default-rtdb.firebaseio.com";
let storageOk = true;
async function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms || 6000);
  try{
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}
async function loadData(isInitial){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/app-data.json`, {}, 6000);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data){ appData = data; }
    else if(isInitial){
      appData = { users: [], challenges: [], games: {}, history: [] };
      await saveData();
    }
    storageOk = true;
  }catch(e){
    console.error('Բեռնման սխալ (ժամանակավոր)', e);
    storageOk = false;
    if(isInitial && !loaded){
      appData = appData || { users: [], challenges: [], games: {}, history: [] };
    }
    // on later (poll) failures we deliberately keep the existing local appData untouched
  }
  loaded = true;
}
async function saveData(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/app-data.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    }, 8000);
    if(!res.ok) throw new Error('HTTP '+res.status);
    storageOk = true;
  }catch(e){
    console.error('Պահպանման սխալ (ժամանակավոր)', e);
    storageOk = false;
  }
}
function genCode(len){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

// ---------- chess engine ----------
const ROOK_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const BISHOP_DIRS=[[1,1],[1,-1],[-1,1],[-1,-1]];
const QUEEN_DIRS=ROOK_DIRS.concat(BISHOP_DIRS);

    for(const [dr,dc] of KNIGHT_OFFS){

      if(inB(nr,nc) && (!board[nr][nc] || pColor(board[nr][nc])!==color)) moves.push([nr,nc]);
    }

    for(const [dr,dc] of QUEEN_DIRS){

}
function applyChessMove(board,from,to){
  const nb=cloneBoard(board);
  const p=nb[from[0]][from[1]];
  nb[from[0]][from[1]]=null;
  let piece=p;
  if(pType(p)==='p' && (to[0]===0||to[0]===7)) piece=pColor(p)+'q';
  nb[to[0]][to[1]]=piece;
  return nb;
}
function chessLegalMoves(board,r,c){
  const p=board[r][c]; if(!p) return [];
  const color=pColor(p);
  return pseudoMoves(board,r,c).filter(([tr,tc])=>{
    const nb=applyChessMove(board,[r,c],[tr,tc]);
    return !inCheck(nb,color);
  });
}
function allChessMoves(board,color){
  let res=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(board[r][c] && pColor(board[r][c])===color){
      chessLegalMoves(board,r,c).forEach(m=>res.push({from:[r,c],to:m}));
    }
  }
  return res;
}
function chessStatus(board,color){
  const moves=allChessMoves(board,color);
  if(moves.length===0) return inCheck(board,color)?'checkmate':'stalemate';
  return 'ongoing';
}
const CHESS_GLYPH={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};

// ---------- checkers engine ----------
function initCheckersBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  for(let r=0;r<3;r++)for(let c=0;c<8;c++) if((r+c)%2===1) b[r][c]='bm';
  for(let r=5;r<8;r++)for(let c=0;c<8;c++) if((r+c)%2===1) b[r][c]='rm';
  return b;
}
function checkersDirs(piece){
  const color=piece[0], type=piece[1];
  if(type==='k') return [[1,1],[1,-1],[-1,1],[-1,-1]];
  return color==='b'? [[1,1],[1,-1]] : [[-1,1],[-1,-1]];
}
function checkersCaptures(board,r,c){
  const p=board[r][c]; if(!p) return [];
  const color=p[0];
  const dirs=checkersDirs(p);
  let moves=[];
  for(const [dr,dc] of dirs){
    const mr=r+dr, mc=c+dc, tr=r+2*dr, tc=c+2*dc;
    if(inB(tr,tc) && board[mr] && board[mr][mc] && board[mr][mc][0]!==color && !board[tr][tc]){
      moves.push({to:[tr,tc], captured:[mr,mc]});
    }
  }
  return moves;
}
function checkersSimple(board,r,c){
  const p=board[r][c]; if(!p) return [];
  const dirs=checkersDirs(p);
  let moves=[];
  for(const [dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(inB(nr,nc) && !board[nr][nc]) moves.push({to:[nr,nc]});
  }
  return moves;
}
function allCheckersCaptures(board,color){
  let res=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(board[r][c] && board[r][c][0]===color){
      checkersCaptures(board,r,c).forEach(m=>res.push({from:[r,c],...m}));
    }
  }
  return res;
}
function allCheckersMoves(board,color){
  const caps=allCheckersCaptures(board,color);
  if(caps.length>0) return caps;
  let res=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    if(board[r][c] && board[r][c][0]===color){
      checkersSimple(board,r,c).forEach(m=>res.push({from:[r,c],...m}));
    }
  }
  return res;
}
function applyCheckersMove(board,move){
  const nb=cloneBoard(board);
  const [fr,fc]=move.from, [tr,tc]=move.to;
  let piece=nb[fr][fc];
  nb[fr][fc]=null;
  if(move.captured) nb[move.captured[0]][move.captured[1]]=null;
  if(piece[1]==='m'){
    if((piece[0]==='b' && tr===7) || (piece[0]==='r' && tr===0)) piece=piece[0]+'k';
  }
  nb[tr][tc]=piece;
  return nb;
}

async function doLogin(){

  if(code === ADMIN_CODE){
    currentUser = { code, name:t('adminName'), isAdmin:true };
    loginError='';
    startPolling();
    render(); // show the admin panel immediately, don't wait on the network
    refresh(); // then refresh data in the background
    return;
  }
  // check the locally-cached data first so login is instant even on a slow connection
  let u = findUser(code);
  if(u){
    currentUser = u;
    loginError='';
    startPolling();
    render();
    refresh(); // sync in the background
    return;
  }
  // not found locally - try a quick network refresh (with a timeout) before giving up
  await loadData(false);
  u = findUser(code);
  if(!u){ loginError=t('errCodeNotFound'); render(); return; }
  currentUser = u;
  loginError='';
  startPolling();
  render();

            <div class="muted">${c.gameType==='chess'?t('chess'):t('checkers')} · <span class="tag wager">${c.wager} ${t('points')}</span></div>
          </div>
          <div class="row" style="max-width:150px">
            <button class="btn-primary btn-small" onclick="respondChallenge('${c.id}',true)">${t('acceptBtn')}</button>
            <button class="btn-danger btn-small" onclick="respondChallenge('${c.id}',false)">${t('declineBtn')}</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="card">
      <h2>${t('sentInvitesH')}</h2>
      ${outgoing.length===0 ? `<div class="empty">${t('noPendingInvites')}</div>` : outgoing.map(c=>`
        <div class="list-item">
          <div>
            <div>${c.toName}</div>
            <div class="muted">${c.gameType==='chess'?t('chess'):t('checkers')} · ${c.wager} ${t('points')} · ${t('pendingLabel')}</div>
          </div>
          <button class="btn-ghost btn-small" onclick="cancelChallenge('${c.id}')">${t('cancelBtn')}</button>
        </div>
      `).join('')}
    </div>
  `;
}
async function respondChallenge(id, accept){
  const c = appData.challenges.find(x=>x.id===id);
  if(!c) return;
  if(!accept){ c.status='declined'; await saveData(); render(); return; }
  const p1 = findUser(c.fromCode), p2 = findUser(c.toCode);
  if(c.wager > p1.points || c.wager > p2.points){
    c.status='declined';
    await saveData();
    render();
    return;
  }
  c.status='active';
  activateChallenge(c);
  await saveData();
  render();
}
async function cancelChallenge(id){
  appData.challenges = appData.challenges.filter(x=>x.id!==id);
  await saveData();
  render();
}
function renderHistoryTab(history){
  return `
    <div class="card">
      <h2>${t('myGamesH')}</h2>
      ${history.length===0 ? `<div class="empty">${t('noFinishedGames')}</div>` : history.map(h=>{
        const won = h.winnerCode===currentUser.code;
        const isDraw = h.winner==='draw';
        const oppName = h.p1Code===currentUser.code ? h.p2Name : h.p1Name;
        return `<div class="list-item">
          <div>
            <div>${t('vs')} ${oppName}</div>
            <div class="muted">${h.gameType==='chess'?t('chess'):t('checkers')} · ${h.wager} ${t('points')}</div>
          </div>
          <div class="tag ${isDraw?'':(won?'':'wager')}">${isDraw?t('draw'):(won?'+'+h.wager:'-'+h.wager)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ---------- GAME ----------
function openGame(challengeId){
  currentGameId = challengeId;
  selected=null;
  render();
}
function closeGame(){
  currentGameId=null; selected=null;
  render();
}
function renderGame(){
  const c = appData.challenges.find(x=>x.id===currentGameId);
  const g = appData.games[currentGameId];
  if(!c || !g){ closeGame(); return; }

  if(g.status==='finished'){
    const winnerName = g.winner==='draw' ? null : findUser(g.winner)?.name;
    el(`
      <div class="brand">
        <div class="eyebrow">${g.type==='chess'?t('chess'):t('checkers')}</div>
        <h1>${t('gameOverH')}</h1>
      </div>
      <div class="card" style="text-align:center">
        ${g.winner==='draw'
          ? `<h2>${t('draw')}</h2><p class="muted">${t('wagerReturned')}</p>`
          : `<h2>${t('wonPrefix')}${winnerName}</h2><p class="muted">${tf('ptsTransferred', c.wager)}</p>`
        }
        <button class="btn-primary" onclick="closeGame()">${t('returnBtn')}</button>
      </div>
    `);
    return;
  }

  const myColor = g.type==='chess'
    ? (g.players.w===currentUser.code?'w':'b')
    : (g.players.b===currentUser.code?'b':'r');
  const isMyTurn = g.turn===myColor;
  const oppCode = c.fromCode===currentUser.code?c.toCode:c.fromCode;
  const oppName = findUser(oppCode)?.name || '—';

  el(`
    <div class="brand">
      <div class="eyebrow">${g.type==='chess'?t('chess'):t('checkers')} · ${c.wager} ${t('points')}</div>
      <h1>${t('vs')} ${oppName}</h1>
    </div>
    <div class="turn-banner">${isMyTurn ? t('yourTurn') : tf('oppTurn', oppName)}</div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <button class="btn-ghost" onclick="closeGame()" style="width:100%">${t('closeGameBtn')}</button>
  `);
  drawBoard(g, myColor, isMyTurn);
}

function drawBoard(g, myColor, isMyTurn){
  const boardEl = document.getElementById('board');
  const board = g.board;
  let legalDest = [];
  if(selected){
    if(g.type==='chess') legalDest = chessLegalMoves(board, selected[0], selected[1]);
    else {
      const caps = checkersCaptures(board, selected[0], selected[1]);
      legalDest = caps.length>0 ? caps.map(m=>m.to) : checkersSimple(board, selected[0], selected[1]).map(m=>m.to);
    }
  }
  let html='';
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const dark = (r+c)%2===1;
      const p = board[r][c];
      const isSel = selected && selected[0]===r && selected[1]===c;
      const isHint = legalDest.some(([hr,hc])=>hr===r&&hc===c);
      let inner='';
      if(g.type==='chess' && p){
        inner = `<span class="pc-${pColor(p)}">${CHESS_GLYPH[p]}</span>`;
      } else if(g.type==='checkers' && p){
        const isKing = p[1]==='k';
        inner = `<div class="checker-piece ${p[0]==='b'?'black':'red'}">${isKing?'♛':''}</div>`;
      }
      html += `<div class="sq ${dark?'dark':'light'} ${isSel?'sel':''} ${isHint && dark? (g.type==='checkers'?'hintcap':'hint'):''}" onclick="squareClick(${r},${c})">${inner}</div>`;
    }
  }
  boardEl.innerHTML = html;
}

async function squareClick(r,c){
  const g = appData.games[currentGameId];
  if(!g || g.status==='finished') return;
  const myColor = g.type==='chess'
    ? (g.players.w===currentUser.code?'w':'b')
    : (g.players.b===currentUser.code?'b':'r');
  if(g.turn!==myColor) return;
  if(g.mustContinueFrom){
    const [fr,fc]=g.mustContinueFrom;
    if(!(fr===r&&fc===c) && !selected){ return; }
  }

  const board = g.board;
  const piece = board[r][c];

  if(g.type==='chess'){
    if(selected){
      const legal = chessLegalMoves(board, selected[0], selected[1]);
      if(legal.some(([lr,lc])=>lr===r&&lc===c)){
        await makeChessMove(g, selected, [r,c]);
        selected=null;
        return;
      }
    }
    if(piece && pColor(piece)===myColor){ selected=[r,c]; render(); }
    else { selected=null; render(); }
  } else {
    const lockedFrom = g.mustContinueFrom;
    if(lockedFrom){
      const caps = checkersCaptures(board, lockedFrom[0], lockedFrom[1]);
      const m = caps.find(m=>m.to[0]===r&&m.to[1]===c);
      if(m){ await makeCheckersMove(g, {from:lockedFrom, ...m}); }
      return;
    }
    if(selected){
      const caps = checkersCaptures(board, selected[0], selected[1]);
      const allCaps = allCheckersCaptures(board, myColor);
      const options = allCaps.length>0 ? caps : checkersSimple(board, selected[0], selected[1]);
      const m = options.find(m=>m.to[0]===r&&m.to[1]===c);
      if(m){ await makeCheckersMove(g, {from:selected, ...m}); selected=null; return; }
    }
    if(piece && piece[0]===myColor){
      const allCaps = allCheckersCaptures(board, myColor);
      if(allCaps.length>0 && !allCaps.some(m=>m.from[0]===r&&m.from[1]===c)){
        selected=null; render(); return;
      }
      selected=[r,c]; render();
    } else { selected=null; render(); }
  }
}

async function makeChessMove(g, from, to){
  g.board = applyChessMove(g.board, from, to);
  const nextColor = g.turn==='w'?'b':'w';
  const status = chessStatus(g.board, nextColor);
  g.turn = nextColor;
  if(status==='checkmate'){
    const winnerColor = g.turn==='w'?'b':'w';
    await finishGame(g, g.players[winnerColor]);
  } else if(status==='stalemate'){
    await finishGame(g, 'draw');
  } else {
    await saveData();
    render();
  }
}

async function makeCheckersMove(g, move){
  g.board = applyCheckersMove(g.board, move);
  if(move.captured){
    const [tr,tc] = move.to;
    const further = checkersCaptures(g.board, tr, tc);
    if(further.length>0){
      g.mustContinueFrom = [tr,tc];
      selected=[tr,tc];
      await saveData();
      render();
      return;
    }
  }
  g.mustContinueFrom = null;
  const nextColor = g.turn==='b'?'r':'b';
  g.turn = nextColor;
  const moves = allCheckersMoves(g.board, nextColor);
  if(moves.length===0){
    const winnerColor = nextColor==='b'?'r':'b';
    await finishGame(g, g.players[winnerColor]);
  } else {
    await saveData();
    render();
  }
}

async function finishGame(g, winnerCodeOrDraw){
  g.status='finished';
  g.winner=winnerCodeOrDraw;
  const c = appData.challenges.find(x=>appData.games[x.id]===g);
  if(c){
    c.status='finished';
    const p1 = findUser(c.fromCode), p2 = findUser(c.toCode);
    let winnerName=null, winnerCode=null;
    if(winnerCodeOrDraw!=='draw'){
      const winner = findUser(winnerCodeOrDraw);
      const loser = winnerCodeOrDraw===p1.code ? p2 : p1;
      winner.points += c.wager;
      loser.points -= c.wager;
      winnerName = winner.name;
      winnerCode = winner.code;
    }
    appData.history.push({
      id: genId(), challengeId:c.id, gameType:c.gameType, wager:c.wager,
      p1Code:p1.code, p1Name:p1.name, p2Code:p2.code, p2Name:p2.name,
      winner: winnerCodeOrDraw, winnerCode, winnerName, date: Date.now()
    });
  }
  await saveData();
  render();
}

// ---------- init ----------
(async function init(){
  await loadData(true);
  if(!storageOk){
    // transient failure on the very first attempt - wait a moment and try again
    await new Promise(r=>setTimeout(r,1500));
    await loadData(true);
  }
  render();
})();
</script>
